name: MT-IAM POC local verification (not release certification)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  poc-platform-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test and database dependencies
        run: python -m pip install -e ".[test,database]"
      - name: Fast deterministic and worker-safety tests
        run: python -m pytest -q -ra -m "not full_registry" --junitxml=pytest-fast.xml tests
      - name: Hard-supervised full registry repeatability (52 cases x 2 rounds)
        run: python -m mt_iam.poc.repeatability_supervisor --repeats 2 --workers 4 --round-timeout 50 --hard-timeout 150 --report poc-repeatability.json
      - name: Full 52-POC isolated registry integration gate
        run: python -m pytest -q -ra -m full_registry --junitxml=pytest-full-registry.xml tests
      - name: Ruff static style checks
        run: python -m ruff check src tests
      - name: 52-item local-only registry checks
        run: python -m mt_iam.poc.runner --output poc52-local-results.json
      - name: Isolated orchestrator (external checks remain BLOCKED)
        run: python -m mt_iam.poc.platform_cli --config configs/platform.toml --report poc-platform-v03-results.json
      - name: Dry run security-critical case
        run: python -m mt_iam.poc.platform_cli --config configs/platform.toml --dry-run --id POC-G05-04
      - name: Upload local-only diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-local-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            poc52-local-results.json
            poc-platform-v03-results.json
            pytest-fast.xml
            pytest-full-registry.xml
            poc-repeatability.json
          if-no-files-found: ignore

# A CI job PASS validates only synthetic/local checks, not OIDC/Supabase/Cloud Run.
# Full POC acceptance needs separate real-provider, security and reviewer evidence.
